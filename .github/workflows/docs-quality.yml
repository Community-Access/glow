name: Docs Quality

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".vale.ini"
      - ".vale/**"
      - ".markdownlint.json"
      - ".github/a11y.markdownlint-cli2.jsonc"
      - ".github/workflows/docs-quality.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".vale.ini"
      - ".vale/**"
      - ".markdownlint.json"
      - ".github/a11y.markdownlint-cli2.jsonc"
      - ".github/workflows/docs-quality.yml"

jobs:
  markdown-accessibility:
    # Open Source Accessibility Framework, Testing action 5: heading levels,
    # one H1, image alternative text, descriptive link text, table shape and
    # code block languages, on every Markdown file outside vendor/, the sample
    # inputs and the AHG workshop materials. The rules and their reasons are in
    # .github/a11y.markdownlint-cli2.jsonc and docs/accessibility-testing.md.
    name: Markdown accessibility lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run markdownlint (accessibility rules)
        run: |
          # The editor config overrides --config when it is in the checkout.
          # Keep it intact while this disposable runner uses the CI rules.
          lint_temp="$(mktemp -d "$RUNNER_TEMP/markdownlint-XXXXXX")"
          mv .markdownlint.json "$lint_temp/editor.json"
          trap 'mv "$lint_temp/editor.json" .markdownlint.json' EXIT

          cat > "$lint_temp/probe.md" <<'EOF'
          # Accessibility lint probe

          ### Skipped heading

          This deliberately long line checks that ordinary prose style is not accidentally enforced by the accessibility-only documentation gate.

          ![](https://example.com/image.png)

          [click here](https://example.com)

          | First | Second |
          | ----- | ------ |
          | one |
          two | two |

          ```
          code
          ```

          # Second title
          EOF
          # A literal path can be linted outside the checkout with gitignore on.
          probe_path="$(node -p 'require("node:path").resolve(process.argv[1])' "$lint_temp/probe.md")"
          if npx --yes markdownlint-cli2@0.18.1 --config .github/a11y.markdownlint-cli2.jsonc --no-globs ":$probe_path" > "$lint_temp/probe.log" 2>&1; then
            echo "::error::The accessibility lint probe unexpectedly passed."
            exit 1
          fi
          for rule in MD001 MD025 MD040 MD045 MD055 MD056 MD059; do
            if ! grep -q "$rule/" "$lint_temp/probe.log"; then
              cat "$lint_temp/probe.log"
              echo "::error::The accessibility lint probe did not report $rule."
              exit 1
            fi
          done
          if grep -q 'MD013/' "$lint_temp/probe.log"; then
            cat "$lint_temp/probe.log"
            echo "::error::The accessibility gate unexpectedly enabled the prose line-length rule."
            exit 1
          fi
          npx --yes markdownlint-cli2@0.18.1 --config .github/a11y.markdownlint-cli2.jsonc

  vale:
    name: Vale prose lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Vale
        uses: errata-ai/vale-action@v2
        with:
          files: docs README.md

  languagetool:
    name: LanguageTool docs check (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Java runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre

      - name: Install LanguageTool client
        run: python -m pip install --upgrade pip language-tool-python

      - name: Run LanguageTool docs check
        run: python .github/scripts/languagetool_check.py || true
